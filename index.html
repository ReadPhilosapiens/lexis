<title>Lexis</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--bg:#0f0e0c;--card:#191714;--line:#2a2621;--ink:#ece6da;--mute:#8f887b;--gold:#d9b26f;--soc:#7fb0a0;--sor:#c98f9a;--cri:#d9b26f;--err:#e39a9a;--r:16px;--field:#12110f;--onacc:#17130b;--def:#cfc8ba;--serif:Georgia,"Iowan Old Style",serif;--sans:-apple-system,"SF Pro Text",system-ui,sans-serif;--glow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);text-shadow:var(--glow)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.serif{font-family:var(--serif)}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 18px) max(18px,env(safe-area-inset-right)) 24px max(18px,env(safe-area-inset-left));-webkit-overflow-scrolling:touch}
nav{display:flex;border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-height:52px;background:none;border:0;color:var(--mute);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
nav button[aria-current=page]{color:var(--gold)}
h1{font-family:var(--serif);font-weight:400;font-size:30px;margin:0 0 2px}
h2{font-family:var(--serif);font-weight:400;font-size:22px;margin:22px 0 8px}
.sub{color:var(--mute);font-size:14px;margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.t-soc{color:var(--soc)}.t-sor{color:var(--sor)}.t-cri{color:var(--cri)}
.term{font-family:var(--serif);font-size:26px;margin:4px 0 6px}
.def{color:var(--def)}
.use{color:var(--mute);font-size:14px;margin-top:10px;border-left:2px solid var(--line);padding-left:10px}
textarea,input[type=text],input[type=search],input:not([type]){width:100%;min-height:48px;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;margin-top:10px;resize:none}
.btn{display:block;width:100%;min-height:48px;background:var(--gold);color:var(--onacc);border:0;border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px;margin-top:10px}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--err);border:1px solid #5a3535}
.row{display:flex;gap:8px}.row>*{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chip{flex:none;min-height:44px;border:1px solid var(--line);background:none;color:var(--mute);border-radius:99px;padding:8px 16px;font-size:14px}
.chip.on{color:var(--ink);border-color:var(--gold)}
.stat{display:flex;gap:10px;margin-bottom:10px}.stat>div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:26px;font-weight:400}
.stat span{font-size:11px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.item{padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--line)}
.box{display:inline-block;min-width:18px;text-align:center;font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:1px 5px;margin-left:6px}
.done{color:var(--soc);font-size:14px;margin-top:8px}
.err{color:var(--err)}
.flip{min-height:230px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.small{font-size:13px;color:var(--mute)}
.zone{margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}

/* ---------- motion base ---------- */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card,.stat{animation:var(--enter,rise) var(--dur,.35s) var(--ease,ease-out) backwards}
main>:nth-child(2){animation-delay:.04s}main>:nth-child(3){animation-delay:.08s}main>:nth-child(4){animation-delay:.12s}
main>:nth-child(5){animation-delay:.16s}main>:nth-child(6){animation-delay:.2s}main>:nth-child(7){animation-delay:.24s}main>:nth-child(8){animation-delay:.28s}
.btn,.chip,nav button{transition:transform .12s,box-shadow .15s,background .2s,color .2s}
.btn:active{transform:scale(.98)}
html[data-light] body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:#1b1710;z-index:50}
.sw{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.sw button{min-height:64px;border-radius:14px;border:2px solid var(--line);padding:8px;text-align:left;font-size:13px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;font-weight:600;position:relative}
.sw button[aria-pressed=true]{outline:2px solid var(--gold);outline-offset:2px}
.sw small{font-weight:400;opacity:.8;font-size:11px}

/* ---------- 1. GLASS: frosted panes that bloom in over a drifting aurora ---------- */
@keyframes bloom{from{opacity:0;transform:scale(.94) translateY(14px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes drift{from{background-position:0% 0%,100% 20%,30% 100%}to{background-position:30% 20%,70% 50%,60% 80%}}
@keyframes sheen{from{transform:translateX(-120%)}to{transform:translateX(220%)}}
html[data-style=glass]{--bg:#0b1020;--card:rgba(255,255,255,.09);--line:rgba(255,255,255,.2);--ink:#f2f5ff;--mute:#aab4d4;--gold:#8fb8ff;--soc:#7fe3cf;--sor:#ff9ec7;--cri:#ffd98a;--field:rgba(255,255,255,.08);--onacc:#091024;--def:#e0e6fb;--r:22px;--enter:bloom;--dur:.6s;--ease:cubic-bezier(.2,.9,.3,1)}
html[data-style=glass] body{background:radial-gradient(55% 40% at 15% 8%,rgba(80,100,255,.55),transparent),radial-gradient(45% 40% at 92% 30%,rgba(230,70,190,.45),transparent),radial-gradient(60% 45% at 40% 100%,rgba(20,200,170,.45),transparent),#0b1020;background-size:160% 160%;background-attachment:fixed;animation:drift 16s ease-in-out infinite alternate}
html[data-style=glass] .card,html[data-style=glass] .stat>div{backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.25);position:relative;overflow:hidden}
html[data-style=glass] .card::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent);animation:sheen 1.4s .3s ease-out 1 both;pointer-events:none}
html[data-style=glass] nav{background:rgba(11,16,32,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
html[data-style=glass] .btn{box-shadow:0 6px 20px rgba(143,184,255,.35)}
html[data-style=glass] .btn:active{transform:scale(.96)}

/* ---------- 2. PAPER: sheets laid down on a ruled desk, flips turn like pages ---------- */
@keyframes laydown{from{opacity:0;transform:translateY(-18px) rotate(-1.6deg)}to{opacity:1;transform:rotate(var(--tilt,0deg))}}
@keyframes pageturn{from{opacity:0;transform:perspective(900px) rotateX(-75deg)}to{opacity:1;transform:perspective(900px) rotateX(0)}}
html[data-style=paper]{--bg:#ece3cf;--card:#fbf6ea;--line:#d8cbad;--ink:#2d2619;--mute:#76694f;--gold:#8f4a27;--soc:#2f6b5a;--sor:#9c3d55;--cri:#8a5a12;--err:#a33a2c;--field:#fffdf6;--onacc:#fbf6ea;--def:#41382a;--r:3px;--enter:laydown;--dur:.55s;--ease:cubic-bezier(.25,.8,.3,1)}
html[data-style=paper] body{background:repeating-linear-gradient(transparent 0 31px,rgba(120,100,60,.12) 31px 32px),#ece3cf}
html[data-style=paper] .card{box-shadow:0 1px 0 #fff inset,0 2px 0 rgba(60,40,10,.06),0 12px 20px -14px rgba(60,40,10,.6);transform-origin:top center}
html[data-style=paper] .card:nth-child(even){--tilt:.35deg}html[data-style=paper] .card:nth-child(3n){--tilt:-.3deg}
html[data-style=paper] .flip{animation:pageturn .5s ease-out backwards;transform-origin:top}
html[data-style=paper] .btn{box-shadow:0 2px 0 rgba(60,40,10,.35)}
html[data-style=paper] .btn:active{transform:translateY(2px);box-shadow:none}
html[data-style=paper] .use{border-left-color:#c97a52}
html[data-style=paper] nav{border-top:1px dashed var(--line)}

/* ---------- 3. BRUTALIST: hard edges, offset shadows, slams in on 4 frames ---------- */
@keyframes slam{from{opacity:0;transform:translate(-14px,-14px);box-shadow:0 0 0 #111}60%{opacity:1}to{transform:none;box-shadow:6px 6px 0 #111}}
html[data-style=brutal]{--bg:#f3efe2;--card:#fff;--line:#111;--ink:#111;--mute:#454545;--gold:#ffd400;--soc:#0a7a3f;--sor:#d6246e;--cri:#1a40d6;--err:#d40000;--field:#fff;--onacc:#111;--def:#111;--r:0px;--serif:"Helvetica Neue",Arial,sans-serif;--sans:"Helvetica Neue",Arial,sans-serif;--enter:slam;--dur:.3s;--ease:steps(4,end)}
html[data-style=brutal] .card,html[data-style=brutal] .stat>div{border:3px solid #111;box-shadow:6px 6px 0 #111}
html[data-style=brutal] h1,html[data-style=brutal] .term{text-transform:uppercase;font-weight:900;letter-spacing:-.02em}
html[data-style=brutal] .btn{border:3px solid #111;box-shadow:4px 4px 0 #111;border-radius:0;text-transform:uppercase;letter-spacing:.04em;font-weight:800}
html[data-style=brutal] .btn:active{transform:translate(4px,4px);box-shadow:0 0 0 #111}
html[data-style=brutal] .btn.ghost{background:#fff;color:#111}
html[data-style=brutal] .btn.danger{background:#fff;border-color:#d40000;box-shadow:4px 4px 0 #d40000}
html[data-style=brutal] textarea,html[data-style=brutal] input{border:3px solid #111;border-radius:0}
html[data-style=brutal] .chip{border:3px solid #111;border-radius:0;color:#111;font-weight:700;background:#fff}
html[data-style=brutal] .chip.on{background:#ffd400;border-color:#111}
html[data-style=brutal] nav{border-top:4px solid #111;background:#ffd400}
html[data-style=brutal] nav button{color:#111;font-weight:800}
html[data-style=brutal] nav button[aria-current=page]{background:#111;color:#ffd400}
html[data-style=brutal] .tag{background:#111;color:#fff!important;display:inline-block;padding:1px 6px}

/* ---------- 4. FUNKY: jelly pops, wobbling words, blobby corners ---------- */
@keyframes pop{0%{opacity:0;transform:scale(.6) rotate(-6deg)}60%{opacity:1;transform:scale(1.04) rotate(1.5deg)}100%{transform:none}}
@keyframes wob{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
@keyframes jelly{0%{transform:scale(1)}30%{transform:scale(1.12,.88)}60%{transform:scale(.94,1.06)}100%{transform:scale(1)}}
html[data-style=funky]{--bg:#2b0f4f;--card:#3b1a68;--line:#7a4cc4;--ink:#fff6e3;--mute:#cdb8f4;--gold:#ff4fa3;--soc:#3ff0b4;--sor:#ff8ac7;--cri:#ffe14d;--err:#ff8a8a;--field:#2b0f4f;--onacc:#fff;--def:#f1e8ff;--r:28px;--serif:ui-rounded,"SF Pro Rounded","Nunito","Trebuchet MS",sans-serif;--sans:ui-rounded,"SF Pro Rounded","Nunito","Trebuchet MS",sans-serif;--enter:pop;--dur:.65s;--ease:cubic-bezier(.34,1.56,.64,1)}
html[data-style=funky] body{background:radial-gradient(circle at 20% 15%,rgba(255,79,163,.28) 0 7px,transparent 8px),radial-gradient(circle at 80% 40%,rgba(63,240,180,.25) 0 9px,transparent 10px),radial-gradient(circle at 35% 85%,rgba(255,225,77,.25) 0 6px,transparent 7px),#2b0f4f;background-size:120px 120px,160px 160px,100px 100px,auto}
html[data-style=funky] .card:nth-child(odd){border-radius:32px 18px 32px 18px}html[data-style=funky] .card:nth-child(even){border-radius:18px 32px 18px 32px}
html[data-style=funky] .card{border-width:2px}
html[data-style=funky] .term{animation:wob 3.4s ease-in-out infinite;transform-origin:left center;font-weight:800}
html[data-style=funky] .flip .term{transform-origin:center}
html[data-style=funky] .btn{background:linear-gradient(135deg,#ff4fa3,#ff9a3d);border-radius:99px;box-shadow:0 5px 0 #a3185f;font-weight:800}
html[data-style=funky] .btn.ghost{background:none;box-shadow:none;border:2px dashed var(--line)}
html[data-style=funky] .btn:active{animation:jelly .4s;box-shadow:0 1px 0 #a3185f;transform:translateY(4px)}
html[data-style=funky] .chip.on{background:#ff4fa3;border-color:#ff4fa3;color:#fff}
html[data-style=funky] nav{background:#1f0a3a}

/* ---------- 5. TERMINAL: phosphor green, scanlines, lines type in left to right ---------- */
@keyframes typein{from{clip-path:inset(0 100% 0 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes flick{0%,100%{opacity:1}50%{opacity:.97}52%{opacity:.9}54%{opacity:1}}
html[data-style=terminal]{--bg:#030804;--card:#06120a;--line:#1b5a2b;--ink:#7dff9a;--mute:#3fae5a;--gold:#7dff9a;--soc:#5ef0c0;--sor:#ff9ad0;--cri:#ffd36b;--err:#ff7a7a;--field:#000;--onacc:#031006;--def:#a8ffbd;--r:2px;--glow:0 0 6px rgba(125,255,154,.4);--serif:ui-monospace,Menlo,Consolas,monospace;--sans:ui-monospace,Menlo,Consolas,monospace;--enter:typein;--dur:.55s;--ease:steps(22,end)}
html[data-style=terminal] body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:60;background:repeating-linear-gradient(rgba(0,0,0,.22) 0 1px,transparent 1px 3px);animation:flick 5s infinite}
html[data-style=terminal] h1::after{content:"_";animation:blink 1s steps(2) infinite;margin-left:2px}
html[data-style=terminal] h1,html[data-style=terminal] .term{font-weight:700}
html[data-style=terminal] .btn{border-radius:2px;text-shadow:none;border:1px solid var(--gold)}
html[data-style=terminal] .btn:active{background:#000;color:var(--gold)}
html[data-style=terminal] .btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
html[data-style=terminal] .btn.danger{border-color:#7a2a2a}
html[data-style=terminal] .chip{border-radius:2px}
html[data-style=terminal] .chip.on{background:rgba(125,255,154,.12)}
html[data-style=terminal] .tag::before{content:"> "}
html[data-style=terminal] .card{box-shadow:0 0 14px rgba(125,255,154,.08)}

/* ---------- 6. CLAY: soft inflated shapes that puff up and press in ---------- */
@keyframes inflate{from{opacity:0;transform:scale(.86);box-shadow:0 0 0 rgba(0,0,0,0),0 0 0 rgba(255,255,255,0)}to{opacity:1;transform:none}}
html[data-style=clay]{--bg:#e3e8f1;--card:#e3e8f1;--line:rgba(46,54,80,.08);--ink:#2e3650;--mute:#667190;--gold:#5b6cff;--soc:#1f8f7a;--sor:#c2447e;--cri:#a8741a;--err:#c0392b;--field:#e3e8f1;--onacc:#fff;--def:#38425f;--r:26px;--enter:inflate;--dur:.6s;--ease:cubic-bezier(.2,.8,.2,1)}
html[data-style=clay] .card,html[data-style=clay] .stat>div{border:0;box-shadow:9px 9px 18px #c1c8d8,-9px -9px 18px #fff}
html[data-style=clay] textarea,html[data-style=clay] input{border:0;box-shadow:inset 5px 5px 10px #c1c8d8,inset -5px -5px 10px #fff}
html[data-style=clay] .btn{box-shadow:6px 6px 12px #b4bcd0,-5px -5px 10px #fff;border-radius:18px}
html[data-style=clay] .btn:active{transform:scale(.98);box-shadow:inset 4px 4px 8px rgba(0,0,0,.25),inset -3px -3px 6px rgba(255,255,255,.25)}
html[data-style=clay] .btn.ghost{background:var(--bg);color:var(--ink);border:0}
html[data-style=clay] .btn.danger{border:0;background:var(--bg)}
html[data-style=clay] .chip{border:0;background:var(--bg);box-shadow:4px 4px 8px #c1c8d8,-4px -4px 8px #fff}
html[data-style=clay] .chip.on{box-shadow:inset 3px 3px 6px #c1c8d8,inset -3px -3px 6px #fff;color:var(--gold);font-weight:600}
html[data-style=clay] .item{border-bottom:1px solid rgba(46,54,80,.08)}
html[data-style=clay] nav{border-top:0;box-shadow:0 -6px 14px rgba(255,255,255,.7)}
html[data-style=clay] .sw button{border:0}

/* ---------- 7. MINIMAL: whitespace, hairlines that draw themselves, a slow fade ---------- */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
html[data-style=minimal]{--bg:#fafaf8;--card:transparent;--line:#e3e3df;--ink:#151515;--mute:#85857f;--gold:#151515;--soc:#2c6e5f;--sor:#9a4a62;--cri:#7a6020;--err:#b3261e;--field:transparent;--onacc:#fafaf8;--def:#2b2b2b;--r:0px;--serif:"Helvetica Neue",Helvetica,Arial,sans-serif;--sans:"Helvetica Neue",Helvetica,Arial,sans-serif;--enter:fade;--dur:.8s;--ease:ease}
html[data-style=minimal] .card{border:0;background:none;padding:20px 0 14px;position:relative;margin-bottom:6px}
html[data-style=minimal] .card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:#151515;opacity:.22;transform-origin:left;animation:draw 1s ease both}
html[data-style=minimal] .stat>div{background:none;border:0;border-top:1px solid #151515;border-radius:0;text-align:left;padding:10px 0}
html[data-style=minimal] h1{font-weight:300;font-size:36px;letter-spacing:-.03em}
html[data-style=minimal] .term{font-weight:300;font-size:30px;letter-spacing:-.02em}
html[data-style=minimal] .tag{letter-spacing:.2em;font-weight:500}
html[data-style=minimal] .use{border-left:0;padding-left:0;font-style:italic}
html[data-style=minimal] .btn{background:none;color:var(--ink);border:0;border-bottom:1px solid #151515;border-radius:0;padding:12px 0;text-align:left;font-weight:500;letter-spacing:.02em}
html[data-style=minimal] .btn:not(.ghost):not(.danger)::after{content:"  \2192";display:inline-block;transition:transform .25s}
html[data-style=minimal] .btn:not(.ghost):not(.danger):active::after{transform:translateX(8px)}
html[data-style=minimal] .btn:active{transform:none;opacity:.45}
html[data-style=minimal] .btn.ghost{color:var(--mute);border-bottom-color:var(--line)}
html[data-style=minimal] .btn.danger{color:var(--err);border-bottom-color:var(--err)}
html[data-style=minimal] textarea,html[data-style=minimal] input{border:0;border-bottom:1px solid #151515;border-radius:0;padding:12px 0}
html[data-style=minimal] .chip{border:0;border-bottom:1px solid transparent;border-radius:0;padding:8px 2px;margin-right:10px}
html[data-style=minimal] .chip.on{border-bottom-color:#151515;color:var(--ink)}
html[data-style=minimal] nav{border-top:1px solid var(--line)}
html[data-style=minimal] nav button{font-size:11px;letter-spacing:.16em}
html[data-style=minimal] nav button[aria-current=page]{color:#151515;box-shadow:inset 0 2px 0 #151515}
html[data-style=minimal] .sw button{border-radius:2px;border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>

 soc:{name:"Sociology",tag:"t-soc",color:"#7fb0a0",goal:"Builds the vocabulary for your Tsukuba research proposal on the 18th Amendment.",
  prompt:"Use it on Pakistan: devolution, provinces, Balochistan, the centre."},
 sor:{name:"Obscure Sorrows",tag:"t-sor",color:"#c98f9a",goal:"Names feelings people can't name: Koenig's coined words plus feeling-words from Urdu, Turkish, German, Japanese and more. Raw material for Philo Sapiens hooks.",
  prompt:"Drop it into one concrete scene. Name the concept, then show the room."},
 cri:{name:"Critical Thinking",tag:"t-cri",color:"#d9b26f",goal:"Catches flawed reasoning in your trades, your content and other people's claims.",
  prompt:"Catch it once in your own thinking today: a trade, a claim, a reel."}
};
var SHELVES=["soc","sor","cri"];
var W=[
/* sociology */
["soc","Social stratification","How a society ranks people into layers by wealth, power or status, and how those layers tend to be inherited."],
["soc","Anomie","A state where the shared rules stop guiding behaviour, so people feel unmoored and norms lose their grip."],
